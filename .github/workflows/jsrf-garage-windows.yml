name: Build JSRF Garage Windows

on:
  push:
    branches:
      - jsrf-native-backup
    paths:
      - '.github/workflows/jsrf-garage-windows.yml'
      - 'JSRF-Native-Backup/checkpoint-05/source.tar.gz.b64.part-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out backup branch
        uses: actions/checkout@v4

      - name: Reconstruct checkpoint 05 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partDir = Join-Path $env:GITHUB_WORKSPACE 'JSRF-Native-Backup/checkpoint-05'
          $parts = @(Get-ChildItem -Path $partDir -Filter 'source.tar.gz.b64.part-*' | Sort-Object Name)
          if ($parts.Count -ne 9) { throw "Expected 9 source bundle parts, found $($parts.Count)." }
          $joined = ($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'jsrf-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'ee4c0593ab9b5ac5290562ecdd21dd8a50db75bcc6c19fd09c8c93d897ef6bf3') {
            throw "Source bundle hash mismatch: $hash"
          }
          $source = Join-Path $env:RUNNER_TEMP 'jsrf-source'
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          tar -xzf $archive -C $source
          "JSRF_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Visual Studio build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'jsrf-build'
          cmake -S $env:JSRF_SOURCE -B $build -G 'Visual Studio 18 2026' -A x64
          "JSRF_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build JSRF-Garage.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build $env:JSRF_BUILD --config Release --target jsrf_garage -- /m
          $exe = Get-ChildItem -Path $env:JSRF_BUILD -Recurse -Filter 'jsrf_garage.exe' | Select-Object -First 1
          if (-not $exe) { throw 'jsrf_garage.exe was not produced.' }
          & $exe.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "Windows smoke test failed with exit code $LASTEXITCODE" }
          "JSRF_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package runnable Garage slice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'JSRF-Garage-Windows'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -LiteralPath $env:JSRF_EXE -Destination (Join-Path $pkg 'JSRF-Garage.exe')
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          title JSRF Native - Retail Garage Slice
          set "MEDIA=%~dp0Media"
          if exist "%MEDIA%\Stage\stg00_.bin" goto launch
          for %%D in ("%~dp0..\Media" "%~dp0..\..\Media") do (
              if exist "%%~fD\Stage\stg00_.bin" set "MEDIA=%%~fD"
          )
          if exist "%MEDIA%\Stage\stg00_.bin" goto launch
          for /f "usebackq delims=" %%I in (`powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms; $f=New-Object System.Windows.Forms.FolderBrowserDialog; $f.Description='Select your extracted JSRF Media folder'; if($f.ShowDialog() -eq 'OK'){[Console]::Write($f.SelectedPath)}"`) do set "MEDIA=%%I"
          if not exist "%MEDIA%\Stage\stg00_.bin" (
              echo The selected folder does not contain Stage\stg00_.bin.
              pause
              exit /b 1
          )
          :launch
          echo Launching retail Garage slice with: %MEDIA%
          "%~dp0JSRF-Garage.exe" --media "%MEDIA%"
          if errorlevel 1 pause
          endlocal
          '@ | Set-Content -LiteralPath (Join-Path $pkg 'Run-JSRF-Garage.bat') -Encoding ascii
          @'
          JSRF Native — Retail Garage Slice (Checkpoint 05)

          1. Extract this artifact ZIP.
          2. Double-click Run-JSRF-Garage.bat.
          3. Select the extracted retail JSRF Media folder if prompted.

          Current controls:
          - Right-mouse drag or arrow keys: orbit camera
          - R: restart the authored Garage rail run
          - Esc: quit

          This is a retail-data-driven milestone: real Garage visuals/textures, retail Beat assets,
          authored Garage grind paths, and recovered multi-segment CPlayer grind traversal.
          It is not yet the complete JSRF locomotion/controller implementation.
          '@ | Set-Content -LiteralPath (Join-Path $pkg 'README.txt') -Encoding utf8
          "JSRF_PACKAGE=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JSRF-Garage-Windows-Checkpoint-05
          path: ${{ env.JSRF_PACKAGE }}
          if-no-files-found: error
          retention-days: 30
